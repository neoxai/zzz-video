<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; }
    dt { font-weight: bold; }
    dd { margin: 0; }
    button { padding: 0.5rem 1.25rem; font-size: 1rem; cursor: pointer; min-width: 6rem; }
    video, canvas { display: block; max-width: 100%; max-height: 70vh; margin-top: 1rem; background: #000; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Back</a></p>
  <h1 id="title">Preview</h1>
  <dl>
    <dt>Horizontal</dt><dd id="width">…</dd>
    <dt>Vertical</dt><dd id="height">…</dd>
    <dt>Duration</dt><dd id="duration">…</dd>
  </dl>
  <div id="error" class="error"></div>
  <button id="toggle">Play</button>
  <video id="video" preload="metadata" playsinline loop></video>
  <canvas id="mjpeg" hidden></canvas>

  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    // Optional subfolder: final or a screen size such as 368-448
    const folder = params.get('folder') || '';
    const label = folder ? `${folder}/${file}` : file;
    const video = document.getElementById('video');
    const toggle = document.getElementById('toggle');
    const errorEl = document.getElementById('error');

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds)) return 'unknown';
      const m = Math.floor(seconds / 60);
      const s = (seconds % 60).toFixed(2).padStart(5, '0');
      return `${m}:${s} (${seconds.toFixed(2)}s)`;
    }

    async function loadInfo() {
      const res = await fetch(`/api/probe?file=${encodeURIComponent(file)}&folder=${encodeURIComponent(folder)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      document.getElementById('width').textContent = `${data.width} px`;
      document.getElementById('height').textContent = `${data.height} px`;
      document.getElementById('duration').textContent = formatDuration(data.duration);
      return data;
    }

    // Screen-size exports are raw MJPEG for the ESP32, which <video> can't
    // play: split it into its JPEG frames and play them on a canvas instead.
    const isMjpeg = file && file.toLowerCase().endsWith('.mjpeg');
    const canvas = document.getElementById('mjpeg');
    const mjpeg = { frames: [], index: 0, timer: null, fps: 30 };

    // Each frame starts with a JPEG SOI marker (FF D8 FF)
    function splitFrames(bytes) {
      const starts = [];
      for (let i = 0; i + 2 < bytes.length; i++) {
        if (bytes[i] === 0xff && bytes[i + 1] === 0xd8 && bytes[i + 2] === 0xff) starts.push(i);
      }
      return starts.map((s, n) => bytes.subarray(s, starts[n + 1] ?? bytes.length));
    }

    async function loadMjpeg(src) {
      const res = await fetch(src);
      if (!res.ok) throw new Error(`Could not load ${label}`);
      const parts = splitFrames(new Uint8Array(await res.arrayBuffer()));
      mjpeg.frames = await Promise.all(parts.map((p) =>
        createImageBitmap(new Blob([p], { type: 'image/jpeg' }))));
      if (mjpeg.frames.length === 0) throw new Error('No frames found');
      canvas.width = mjpeg.frames[0].width;
      canvas.height = mjpeg.frames[0].height;
      drawFrame();
    }

    function drawFrame() {
      canvas.getContext('2d').drawImage(mjpeg.frames[mjpeg.index], 0, 0);
    }

    function toggleMjpeg() {
      if (mjpeg.timer) {
        clearInterval(mjpeg.timer);
        mjpeg.timer = null;
        toggle.textContent = 'Play';
        return;
      }
      mjpeg.timer = setInterval(() => {
        mjpeg.index = (mjpeg.index + 1) % mjpeg.frames.length;
        drawFrame();
      }, 1000 / mjpeg.fps);
      toggle.textContent = 'Pause';
    }

    toggle.addEventListener('click', () => {
      if (isMjpeg) toggleMjpeg();
      else if (video.paused) video.play();
      else video.pause();
    });
    video.addEventListener('play', () => { toggle.textContent = 'Pause'; });
    video.addEventListener('pause', () => { toggle.textContent = 'Play'; });

    if (!file) {
      errorEl.textContent = 'No file specified';
      toggle.disabled = true;
    } else {
      document.title = `Preview – ${label}`;
      document.getElementById('title').textContent = label;
      const src = `/video/${folder ? `${encodeURIComponent(folder)}/` : ''}${encodeURIComponent(file)}`;
      const info = loadInfo();
      if (isMjpeg) {
        video.hidden = true;
        canvas.hidden = false;
        toggle.disabled = true;
        info.then((data) => { mjpeg.fps = data.fps || mjpeg.fps; }).catch(() => {});
        loadMjpeg(src)
          .then(() => { toggle.disabled = false; })
          .catch((err) => { errorEl.textContent = err.message; });
      } else {
        video.src = src;
      }
      info.catch((err) => { errorEl.textContent = err.message; });
    }
  </script>
</body>
</html>
