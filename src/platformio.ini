; =========================
; PlatformIO Configuration
; Waveshare ESP32-S3-Touch-AMOLED-1.8
; zzz-video firmware
; =========================

; Two firmware modes share everything below; upload.sh picks one via MODE.
;   static  — one video looping forever, no touch/GPIO input
;   dynamic — every video in data/, swipe left/right to switch (touch boards)
[platformio]
default_envs = static

[env:static]
build_flags = ${env.build_flags} -DVIDEO_MODE_STATIC
; no touch/GPIO input at all
build_src_filter = +<*> -<touch.cpp>

[env:dynamic]
build_flags = ${env.build_flags} -DVIDEO_MODE_DYNAMIC

[env]
platform = espressif32@^6.3.0

; ---------------------------------
; BOARD SELECTION
; ---------------------------------
; ESP32-S3R8 (8MB octal PSRAM) + 16MB QIO flash
board = esp32-s3-devkitc-1

framework = arduino

; ---------------------------------
; SERIAL MONITOR
; ---------------------------------
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------
; FLASH / MEMORY CONFIG
; ---------------------------------
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; data/ (MJPEG videos generated by upload.sh) is flashed to the "spiffs"
; partition as LittleFS via `pio run -t uploadfs`.
board_build.filesystem = littlefs

; ---------------------------------
; BUILD FLAGS
; ---------------------------------
; The board's USB-C goes straight to the S3's native USB (no UART bridge),
; so Serial must be routed over USB CDC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++2a
; Uncomment for the older SH8601-panel revision (see src/amoled.h):
;   -DAMOLED_V1
build_unflags = -std=gnu++11

; ---------------------------------
; LIBRARIES
; ---------------------------------
; GFX 1.4.x is the last line that supports Arduino-ESP32 2.x (platform 6.x).
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9
    bitbank2/JPEGDEC @ ^1.8.2

; ---------------------------------
; UPLOAD SETTINGS
; ---------------------------------
upload_speed = 921600

; If PlatformIO picks the wrong port:
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0

; ---------------------------------
; COMMON TROUBLESHOOTING NOTES
; ---------------------------------
; - If upload can't find the device:
;     Hold BOOT, tap RESET, release BOOT to force download mode.
;
; - If the screen stays black:
;     Check the TCA9554 expander answers at 0x20 (see serial log) —
;     it gates the AMOLED's power/reset lines.
